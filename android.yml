name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project in: $PROJECT_DIR"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: ${{ steps.project.outputs.dir }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akula-wink-pro-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
